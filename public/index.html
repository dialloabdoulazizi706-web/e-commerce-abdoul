<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Abdoul</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f6f8; }
    h1 { text-align: center; color: #333; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .card img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
    .price { color: #27ae60; font-weight: bold; font-size: 1.2em; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Boutique en Ligne E-Commerce Abdoul</h1>
  <div id="products" class="products-grid"></div>

  <script>
    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const products = await res.json();
        const container = document.getElementById('products');
        if(products.length === 0) {
          container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Aucun produit disponible pour le moment.</p>';
          return;
        }
        container.innerHTML = products.map(p => `
          <div class="card">
            <img src="${p.image_url || 'https://via.placeholder.com/150'}" alt="${p.name}">
            <h3>${p.name}</h3>
            <p class="price">${p.price} FCFA</p>
            <p>${p.description || ''}</p>
          </div>
        `).join('');
      } catch (err) {
        console.error('Erreur de chargement:', err);
      }
    }
    loadProducts();
  </script>
</body>
</html>
